# Daymark self-hosted stack: the Next.js application and PostgreSQL.
#
# Local development (database only):   docker compose up -d db
# Full self-hosted deployment:          docker compose --profile app up -d --build
#
# Copy .env.example to .env first. The database port is bound to the loopback
# interface only, so PostgreSQL is never exposed publicly by default.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daymark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daymark}
      POSTGRES_DB: ${POSTGRES_DB:-daymark}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - daymark-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-daymark} -d ${POSTGRES_DB:-daymark}']
      interval: 5s
      timeout: 5s
      retries: 12

  # Local SMTP catcher for development and end-to-end tests. Not for production.
  #   docker compose --profile mail up -d mailpit   ->  inbox at http://127.0.0.1:8025
  mailpit:
    profiles: ['mail']
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the Compose network the database host is the service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-daymark}:${POSTGRES_PASSWORD:-daymark}@db:5432/${POSTGRES_DB:-daymark}
      DATABASE_URL_UNPOOLED: postgresql://${POSTGRES_USER:-daymark}:${POSTGRES_PASSWORD:-daymark}@db:5432/${POSTGRES_DB:-daymark}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  daymark-postgres:
