name: Bug report
description: Something in Daymark does not work as documented.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Do not include real credentials, secrets or personal data in this form, and report security vulnerabilities privately as described in SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest path that triggers the problem.
      placeholder: |
        1. Sign in and open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages exactly as shown.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Daymark version or commit
      description: The version from package.json or the git commit you are running.
      placeholder: 0.2.0 or a commit SHA
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is Daymark running?
      options:
        - Docker Compose (docker compose --profile app up)
        - Local development (pnpm dev)
        - Vercel
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, PostgreSQL version and browser where relevant.
      placeholder: Ubuntu 24.04, Node 22.x, PostgreSQL 17, Firefox 140

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output, browser console or network errors. Redact connection strings, secrets and email addresses.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this bug has not been reported yet.
          required: true
        - label: This report contains no secrets, credentials or personal data.
          required: true
